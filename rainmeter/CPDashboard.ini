[Rainmeter]
Update=1000
AccurateText=1
MetadataName=CP Dashboard
MetadataAuthor=Dhruv
MetadataVersion=1.0
MouseScrollUpAction=[!CommandMeasure MeasureScript "ScrollUp()"]
MouseScrollDownAction=[!CommandMeasure MeasureScript "ScrollDown()"]


[Variables]
@Include=variables.inc
GridStartX=29
CalendarStartY=110
ContestsStartY=295

; ------------------------------------------------------------------------
; MEASURES
; ------------------------------------------------------------------------

[MeasureWeekday]
Measure=Time
Format=%A

[MeasureDate]
Measure=Time
Format=%d %B %Y

[MeasureScript]
Measure=Script
ScriptFile=CPDashboard.lua
UpdateDivider=-1

; Run Python Fetcher asynchronously and refresh on completion (Phase 7)
[MeasureRunFetcher]
Measure=Plugin
Plugin=RunCommand
Parameter=python "#CURRENTPATH#..\fetch\fetch_contests.py"
State=Hide
FinishAction=[!Refresh]

; ------------------------------------------------------------------------
; STYLES
; ------------------------------------------------------------------------

[StyleCellDefault]
Shape=Rectangle 0,0,#CellSize#,#CellSize#,3 | Fill Color #ColorCellDefault# | Stroke Width 0

[StyleTextDefault]
FontFace=#FontCode#
FontSize=10
FontColor=#ColorTextSecondary#
StringAlign=CenterCenter
AntiAlias=1

; ------------------------------------------------------------------------
; METERS - BACKGROUND & HEADER
; ------------------------------------------------------------------------

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,#SkinWidth#,#SkinHeight#,6 | Fill Color #ColorBackground# | Stroke Color #ColorBorder# | StrokeWidth 1

[MeterWeekdayHeader]
Meter=String
MeasureName=MeasureWeekday
X=#Padding#
Y=#Padding#
FontFace=#FontPrimary#
FontSize=14
FontColor=#ColorTextPrimary#
FontStyle=Bold
Text=%1
AntiAlias=1

[MeterDateHeader]
Meter=String
MeasureName=MeasureDate
X=#Padding#
Y=40
FontFace=#FontPrimary#
FontSize=10
FontColor=#ColorTextSecondary#
Text=%1
AntiAlias=1

