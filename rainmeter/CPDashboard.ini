ToolTipText=Blue: Codeforces only#CRLF#Orange: LeetCode only#CRLF#Green: Both platforms (different times)#CRLF#Purple: Both platforms (same start time)#CRLF#White Border: Today's date
MouseOverAction=[!SetOption MeterColorGuide StringStyle Underline][!SetOption MeterColorGuide FontColor #ColorTextPrimary#][!UpdateMeter MeterColorGuide][!Redraw]
MouseLeaveAction=[!SetOption MeterColorGuide StringStyle Normal][!SetOption MeterColorGuide FontColor #ColorTextSecondary#][!UpdateMeter MeterColorGuide][!Redraw]
AntiAlias=1

[MeterRefreshIcon]
